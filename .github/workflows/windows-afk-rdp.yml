name: "Windows AFK Gaming RDP (Tailscale)"

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Durasi sesi RDP dalam menit (Maks 330 menit agar sisa waktu aman untuk Atomic Auto-Backup)"
        required: true
        default: "330"
        type: choice
        options:
          - "60"
          - "120"
          - "180"
          - "240"
          - "300"
          - "330"
      runner_os:
        description: "Pilih Spesifikasi Runner (windows-2022/2025 = 4 vCPU x64 Gratis | windows-11-arm = 4 Physical Cores Win11 Gratis | 8-64core butuh Larger Runner)"
        required: true
        default: "windows-2022"
        type: choice
        options:
          - "windows-2022"
          - "windows-11-arm"
          - "windows-2025"
          - "windows-latest"
          - "windows-latest-8-cores"
          - "windows-2022-8core"
          - "windows-2022-16core"
          - "windows-2022-32core"
          - "windows-2022-64core"
      hostname:
        description: "Nama Perangkat di Tailscale (huruf kecil, angka, strip; maks 63)"
        required: true
        default: "s-rdp-afk"
        type: string
      rdp_fps:
        description: "Batas FPS komposisi desktop RDP (30 = paling seimbang untuk render CPU; 60 hanya untuk runner ber-GPU)"
        required: false
        default: "30"
        type: choice
        options:
          - "15"
          - "24"
          - "30"
          - "60"
      tune_rendering:
        description: "Tuning renderer GPU-less (LP_NUM_THREADS, mesa_glthread, vblank off, RDP encoder hemat CPU)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: s-rdp-tailscale-${{ inputs.hostname || 'default' }}
  cancel-in-progress: false

jobs:
  afk-rdp:
    name: "S-RDP Windows + Tailscale"
    runs-on: ${{ inputs.runner_os }}
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validasi Secret Tailscale & Password RDP
        id: validate
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
          SETUP_USER: "egandika"
          TS_HOSTNAME: ${{ inputs.hostname }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            Write-Error "Secret 'TS_AUTHKEY' belum diatur! Buka Settings -> Secrets and variables -> Actions -> New repository secret, lalu tambahkan TS_AUTHKEY dari Tailscale Admin Console."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            Write-Error "Secret 'RDP_PASSWORD' belum diatur! Buka Settings -> Secrets and variables -> Actions -> New repository secret, lalu tambahkan RDP_PASSWORD (minimal 8 karakter kombinasi huruf besar, huruf kecil, angka, dan simbol, contoh: GamingAfk@2026)."
            exit 1
          }
          if ($env:RDP_PASSWORD.Length -lt 8) {
            Write-Error "RDP_PASSWORD terlalu pendek! Windows Server mewajibkan minimal 8 karakter dengan kombinasi huruf besar, huruf kecil, dan angka/simbol."
            exit 1
          }
          if ($env:RDP_PASSWORD.Contains('"')) {
            Write-Error "RDP_PASSWORD tidak boleh mengandung karakter kutip ganda ("" ) karena dipakai sebagai argumen 7-Zip (-p""..."")."
            exit 1
          }

          $vaultPass = $env:VAULT_PASSWORD
          if (-not [string]::IsNullOrWhiteSpace($vaultPass) -and $vaultPass.Contains('"')) {
            Write-Error "VAULT_PASSWORD tidak boleh mengandung karakter kutip ganda ("" )."
            exit 1
          }

          # Username RDP sekarang dikunci di "egandika" (tanpa input), jadi tetap aman dipakai sebagai
          # nama folder C:\Users\<user> maupun argumen icacls.
          if ($env:SETUP_USER -notmatch '^[A-Za-z0-9._-]{1,20}$') {
            Write-Error "Username RDP internal tidak valid: '$($env:SETUP_USER)'"
            exit 1
          }
          if ($env:TS_HOSTNAME -notmatch '^[a-z0-9][a-z0-9-]{0,62}$') {
            Write-Error "Nama perangkat Tailscale tidak valid! Gunakan huruf kecil, angka, dan strip (maks 63 karakter), contoh: s-rdp-afk"
            exit 1
          }
          Write-Host "Secret TS_AUTHKEY & RDP_PASSWORD serta Hostname terdeteksi valid (username dikunci: $($env:SETUP_USER))." -ForegroundColor Green

      - name: Bersihkan Disk untuk Game Ukuran Besar (+30GB Free)
        shell: pwsh
        run: |
          Write-Host "Membersihkan folder SDK besar yang tidak terpakai oleh game..." -ForegroundColor Cyan
          # CATATAN: folder temp runner (D:\a\_temp / $env:RUNNER_TEMP) TIDAK boleh dihapus karena step
          # yang sedang berjalan mengeksekusi skripnya dari sana.
          $Targets = @(
            "C:\Android",
            "C:\hostedtoolcache\windows\CodeQL",
            "C:\ghcup",
            "C:\Program Files\dotnet\sdk"
          )
          foreach ($targetPath in $Targets) {
            if (Test-Path -LiteralPath $targetPath) {
              Write-Host "Menghapus $targetPath ..."
              Remove-Item -LiteralPath $targetPath -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive C, D -ErrorAction SilentlyContinue | Format-Table Name, @{N="Used(GB)";E={[math]::Round($_.Used/1GB,2)}}, @{N="Free(GB)";E={[math]::Round($_.Free/1GB,2)}}
          $global:LASTEXITCODE = 0
          exit 0

      - name: Optimasi Windows Server & Setup Mode AFK Game
        shell: pwsh
        env:
          SETUP_USER: "egandika"
          SETUP_PASS: ${{ secrets.RDP_PASSWORD }}
          TUNE_RENDERING: ${{ inputs.tune_rendering }}
          RDP_FPS: ${{ inputs.rdp_fps }}
        run: |
          $fps = 30
          if (-not [int]::TryParse("$($env:RDP_FPS)".Trim(), [ref]$fps)) { $fps = 30 }
          & .\scripts\setup-afk-windows.ps1 `
            -RdpUser $env:SETUP_USER `
            -RdpPassword $env:SETUP_PASS `
            -InstallGameRuntimes "true" `
            -InstallMesa3D "true" `
            -TuneRendering "$($env:TUNE_RENDERING)" `
            -RdpFps $fps
          if ($LASTEXITCODE -ne 0) { throw "setup-afk-windows.ps1 gagal (exit $LASTEXITCODE)" }

      - name: Pulihkan Data Permanen (Steam, Discord, & Atomic Vault AES-256)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VAULT_PASS: ${{ secrets.VAULT_PASSWORD || secrets.RDP_PASSWORD }}
          SETUP_USER: "egandika"
        run: |
          & .\scripts\sync-vault.ps1 `
            -Mode "restore" `
            -VaultPassword $env:VAULT_PASS `
            -RdpUser $env:SETUP_USER `
            -InstallApps "true"
          if ($LASTEXITCODE -ne 0) { throw "sync-vault.ps1 (restore) gagal (exit $LASTEXITCODE)" }

      - name: Install & Hubungkan Tailscale VPN
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: ${{ inputs.hostname }}
          version: latest

      - name: Tampilkan Informasi Koneksi RDP
        id: conn_info
        shell: pwsh
        env:
          RDP_USER: "egandika"
          DURATION: ${{ inputs.duration_minutes }}
          RDP_FPS: ${{ inputs.rdp_fps }}
        run: |
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) {
            $tsCmd = Get-Command tailscale.exe -ErrorAction SilentlyContinue
            if ($tsCmd) { $tsExe = $tsCmd.Source }
          }
          $tsIp = ""
          if (Test-Path $tsExe) {
            $tsIp = ((& $tsExe ip -4 2>$null | Select-Object -First 1) -as [string])
            if ($tsIp) { $tsIp = $tsIp.Trim() } else { $tsIp = "" }
          }
          $dnsName = ""
          try {
            $tsStatus = (& $tsExe status --json 2>$null | ConvertFrom-Json -ErrorAction Stop)
            if ($tsStatus.Self.DNSName) { $dnsName = $tsStatus.Self.DNSName.TrimEnd('.') }
          } catch {}
          if ([string]::IsNullOrWhiteSpace($tsIp)) { $tsIp = "(lihat log Tailscale di atas)" }

          $freeC = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
          $freeD = if (Get-PSDrive D -ErrorAction SilentlyContinue) { [math]::Round((Get-PSDrive D).Free / 1GB, 1) } else { 0 }
          $cpuProcs = @(Get-CimInstance Win32_Processor)
          $cpuName = "$($cpuProcs[0].Name)".Trim()
          $cpuCores = ($cpuProcs | Measure-Object -Property NumberOfCores -Sum).Sum
          $cpuThreads = ($cpuProcs | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
          $osRamGb = [math]::Round((Get-CimInstance Win32_OperatingSystem).TotalVisibleMemorySize / 1MB, 1)
          $vaultRoot = if (Test-Path "C:\ProgramData\S-RDP\vault-root.txt") { (Get-Content "C:\ProgramData\S-RDP\vault-root.txt" -Raw).Trim() } else { "Nonaktif" }

          # --- Renderer / FPS diagnostics -------------------------------------------------
          $gpuAdapters = @(Get-CimInstance Win32_VideoController -ErrorAction SilentlyContinue)
          $realGpu = @($gpuAdapters | Where-Object {
            $_.Name -and
            $_.Name -notmatch 'Microsoft Basic (Render|Display)' -and
            $_.Name -notmatch 'Remote Display Adapter' -and
            $_.Name -notmatch 'Microsoft Hyper-V Video' -and
            $_.Name -notmatch 'Standard VGA'
          })
          $renderPath = if ($realGpu.Count -gt 0) { "Hardware GPU: $($realGpu[0].Name)" } else { "Software (WARP DirectX + Mesa3D llvmpipe OpenGL)" }
          $mesaActive = if (Test-Path "$env:SystemRoot\System32\opengl32.dll.srdp-bak") { "AKTIF (OpenGL 4.5)" } else { "tidak aktif" }
          $dwmInterval = (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations" -Name DWMFRAMEINTERVAL -ErrorAction SilentlyContinue).DWMFRAMEINTERVAL
          $fpsLabel = if ($dwmInterval) { "$([math]::Round(1000 / $dwmInterval)) FPS" } else { "default Windows" }
          $rasterThreads = [Environment]::GetEnvironmentVariable("LP_NUM_THREADS", "Machine")

          # --- Diagnostik latensi input: Tailscale DIRECT vs RELAY (DERP) ---------------------
          # Kalau koneksi lewat relay DERP, setiap klik/gerakan mouse harus menempuh rute jauh ->
          # inilah penyebab "klik terasa ada jeda" walau CPU server idle.
          $peerLines = @()
          $relayWarn = $false
          $pingLine = ""
          try {
            if ($tsStatus.Peer) {
              foreach ($peerProp in $tsStatus.Peer.PSObject.Properties) {
                $peer = $peerProp.Value
                if (-not $peer.Online) { continue }
                if ($peer.CurAddr) {
                  $peerLines += "$($peer.HostName) = DIRECT ($($peer.CurAddr))"
                } elseif ($peer.Relay) {
                  $peerLines += "$($peer.HostName) = RELAY $($peer.Relay) (latency tinggi!)"
                  $relayWarn = $true
                } else {
                  $peerLines += "$($peer.HostName) = tidak diketahui"
                }
              }
              $firstOnline = ($tsStatus.Peer.PSObject.Properties | ForEach-Object { $_.Value } | Where-Object { $_.Online } | Select-Object -First 1)
              if ($firstOnline -and (Test-Path $tsExe)) {
                $pingOut = (& $tsExe ping -c 3 --timeout 3s $firstOnline.HostName 2>&1 | Out-String)
                $pingMatch = [regex]::Matches($pingOut, 'in ([0-9.]+) ?ms')
                if ($pingMatch.Count -gt 0) {
                  $rttValues = $pingMatch | ForEach-Object { [double]$_.Groups[1].Value }
                  $pingLine = "$([math]::Round(($rttValues | Measure-Object -Average).Average, 0)) ms"
                }
              }
            }
          } catch {}
          if (-not $pingLine) { $pingLine = "tidak terukur" }

          Write-Host ""
          Write-Host "================================================================" -ForegroundColor Green
          Write-Host "   S-RDP (AFK GAMING EDITION) SUDAH AKTIF & SIAP DIGUNAKAN!     " -ForegroundColor Green
          Write-Host "================================================================" -ForegroundColor Green
          Write-Host " IP Tailscale (IPv4) : $tsIp" -ForegroundColor Yellow
          if ($dnsName) {
            Write-Host " MagicDNS Hostname   : $dnsName" -ForegroundColor Yellow
          }
          Write-Host " Port RDP            : 3389 (Frame pacing $fpsLabel)"
          Write-Host " Jalur Render        : $renderPath"
          Write-Host " Latensi Tailscale   : $pingLine (semakin kecil = klik semakin responsif)" -ForegroundColor Yellow
          foreach ($pl in $peerLines) { Write-Host "   - $pl" }
          if ($relayWarn) {
            Write-Host " PERINGATAN: koneksi lewat RELAY DERP (bukan direct) -> input terasa berjeda." -ForegroundColor Red
            Write-Host "   Perbaiki: pastikan aplikasi Tailscale di HP/PC kamu mengizinkan UDP," -ForegroundColor Red
            Write-Host "   aktifkan 'Use Tailscale DNS'/'Direct connections', atau jalankan" -ForegroundColor Red
            Write-Host "   'tailscale ping <hostname>' sampai muncul 'via <IP>:41641'." -ForegroundColor Red
          }
          Write-Host " Mesa3D OpenGL       : $mesaActive (LP_NUM_THREADS=$rasterThreads)"
          Write-Host " Username            : $($env:RDP_USER)" -ForegroundColor Cyan
          Write-Host " Password            : (Sesuai Secret RDP_PASSWORD kamu)" -ForegroundColor Cyan
          Write-Host " Hardware Runner     : $cpuName ($cpuCores Cores / $cpuThreads vCPU Threads) | $osRamGb GB RAM"
          Write-Host " Folder Anti-Reset   : $vaultRoot (Atomic AES-256 Auto-Backup)" -ForegroundColor Green
          Write-Host " Sisa Disk Space     : C: $freeC GB | D: $freeD GB (+ 20 GB Virtual Pagefile)"

          # --- File klien .rdp optimal (16-bit, LAN, tanpa animasi/wallpaper, 1280x720) --------------
          # Diunggah sebagai artefak run supaya kamu tinggal download & double-click, tanpa setting manual.
          try {
            if ($tsIp -match '^\d+\.\d+\.\d+\.\d+$') {
              $rdpContent = @(
                "full address:s:$tsIp",
                "username:s:$($env:RDP_USER)",
                "prompt for credentials:i:1",
                "promptcredentialonce:i:1",
                "enablecredsspsupport:i:0",
                "authentication level:i:2",
                "desktopwidth:i:1280",
                "desktopheight:i:720",
                "smart sizing:i:0",
                "dynamic resolution:i:1",
                "session bpp:i:16",
                "compression:i:1",
                "keyboardhook:i:2",
                "videoplaybackmode:i:1",
                "connection type:i:6",
                "networkautodetect:i:0",
                "bandwidthautodetect:i:0",
                "displayconnectionbar:i:1",
                "disable wallpaper:i:1",
                "disable full window drag:i:1",
                "disable menu anims:i:1",
                "disable themes:i:1",
                "disable cursor setting:i:1",
                "allow font smoothing:i:0",
                "allow desktop composition:i:0",
                "autoreconnection enabled:i:1",
                "bitmapcachepersistenable:i:1",
                "audiomode:i:0",
                "audiocapturemode:i:0",
                "redirectprinters:i:0",
                "redirectcomports:i:0",
                "redirectsmartcards:i:0",
                "redirectposdevices:i:0",
                "redirectclipboard:i:1",
                "devicestoredirect:s:",
                "drivestoredirect:s:",
                "usbdevicestoredirect:s:",
                "camerastoredirect:s:"
              )
              $rdpPath = Join-Path $env:GITHUB_WORKSPACE "S-RDP-Optimal.rdp"
              ($rdpContent -join "`r`n") | Out-File -FilePath $rdpPath -Encoding ascii
              Write-Host " File klien optimal : S-RDP-Optimal.rdp (unduh di bagian Artifacts run ini)" -ForegroundColor Yellow
            }
          } catch {
            Write-Warning "Gagal membuat file .rdp: $_"
          }
          Write-Host " Durasi Sesi         : $($env:DURATION) menit"
          Write-Host "----------------------------------------------------------------"
          Write-Host " PENTING UNTUK AFK GAME & ANTI-RESET:" -ForegroundColor Magenta
          Write-Host " 1. Gunakan resolusi RDP 1280x720 agar posisi klik auto-clicker"
          Write-Host "    sama persis 100% dengan layar Console AFK!"
          Write-Host " 2. Saat mau tutup RDP & tinggal AFK, klik 2x"
          Write-Host "    'AFK-Disconnect-Tanpa-Freeze.bat' di Desktop!"
          Write-Host " 3. Kalau game masih 5 FPS: klik 2x 'Optimalkan-Game-Ini.bat',"
          Write-Host "    pilih .exe game, lalu jalankan lewat launcher hemat CPU yang dibuat."
          Write-Host "================================================================" -ForegroundColor Green

          $summaryLines = @(
            "## 🎮 S-RDP (Audited AFK Gaming + Atomic Vault) Siap Digunakan!",
            "",
            "| Parameter | Detail Koneksi |",
            "| :--- | :--- |",
            "| **Tailscale IP** | ``$tsIp`` |",
            "| **MagicDNS** | ``$dnsName`` |",
            "| **Username** | ``$($env:RDP_USER)`` |",
            "| **Password** | Sesuai GitHub Secret ``RDP_PASSWORD`` |",
            "| **Spesifikasi Mesin** | ``$cpuName`` (**$cpuCores Cores / $cpuThreads vCPU Threads**, **$osRamGb GB RAM + 20 GB Pagefile**) |",
            "| **Folder Anti-Reset** | ``$vaultRoot`` *(Atomic AES-256 Backup ke GitHub Release ``s-rdp-vault``)* |",
            "| **Jalur Render** | ``$renderPath`` — Mesa3D OpenGL: **$mesaActive** (`LP_NUM_THREADS=$rasterThreads`) |",
            "| **Latensi Tailscale** | ``$pingLine`` — $(if ($relayWarn) { '**RELAY DERP (input berjeda!)**' } else { 'Direct/low-latency' }) |",
            "| **Input Latency Tuning** | ``MenuShowDelay=0 ms`` · ``MouseHoverTime=0`` · pointer accel OFF · key-repeat instan |",
            "| **File Klien** | Unduh artefak ``S-RDP-Optimal-<run id>`` → double-click. Sudah 16-bit, LAN, 1280x720, animasi/wallpaper OFF |",
            "| **Frame Pacing RDP** | ``$fpsLabel`` *(turunkan ke 24/15 bila CPU masih penuh)* |",
            "| **Resolusi Console AFK** | ``1280x720 @ 100% DPI`` *(Samakan resolusi aplikasi RDP ke 1280x720 untuk Auto-Clicker)* |",
            "| **Fitur Keamanan Data** | Anti-Reset Vault, Steam/Discord, DirectX+VC++, Mesa3D, dan pembersihan SDK **selalu aktif** |",
            "| **Kapasitas Kosong** | ``C:\`` **$freeC GB** / ``D:\`` **$freeD GB** |",
            "| **Batas Waktu** | **$($env:DURATION) Menit** |",
            "",
            "### 💾 Panduan Anti-Reset & AFK Tanpa Freeze",
            "- **Steam & Discord** siap di Desktop (menggunakan *Instant NTFS Junction* — tidak makan ruang ganda & bebas profil korup).",
            "- Simpan semua game/bot di dalam **``$vaultRoot``** (klik shortcut **``Folder-Permanen-Anti-Reset``** di Desktop).",
            "- Klik 2x **``AFK-Disconnect-Tanpa-Freeze.bat``** saat ingin menutup RDP agar game tetap jalan 100%.",
            "- Klik 2x **``Simpan-Data-Sekarang.bat``** kapan saja untuk live-save tanpa menutup game, atau **``Matikan-Server-RDP.bat``** saat selesai.",
            "- **Game 5 FPS?** Klik 2x **``Optimalkan-Game-Ini.bat``** lalu pilih file ``.exe`` game (memasang Mesa3D llvmpipe + mematikan komposisi ganda DWM + membuat launcher hemat CPU), dan pakai **``Cek-Performa-Render.bat``** untuk melihat renderer & proses yang paling berat."
          )
          ($summaryLines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Unggah File Klien RDP Optimal (Artefak)
        uses: actions/upload-artifact@v4
        with:
          name: S-RDP-Optimal-${{ github.run_id }}
          path: S-RDP-Optimal.rdp
          if-no-files-found: warn
          retention-days: 3

      - name: Menjaga Sesi AFK Tetap Hidup (Zero-Overhead Loop + In-RDP Warnings)
        shell: pwsh
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          GH_TOKEN: ${{ github.token }}
          VAULT_PASS: ${{ secrets.VAULT_PASSWORD || secrets.RDP_PASSWORD }}
          SETUP_USER: "egandika"
        run: |
          $maxMinutes = [int]$env:DURATION_MINUTES
          if ($maxMinutes -gt 330) { $maxMinutes = 330 }
          if ($maxMinutes -lt 5) { $maxMinutes = 5 }

          $endTime = (Get-Date).AddMinutes($maxMinutes)
          $lastTelemetry = (Get-Date).AddMinutes(-10)
          $warned10Min = $false
          $warned3Min  = $false

          Write-Host "Sesi RDP dijaga tetap hidup hingga $($endTime.ToString('HH:mm:ss')) UTC ($maxMinutes menit)..." -ForegroundColor Cyan

          while ((Get-Date) -lt $endTime) {
            # Fast 5-second flag check (zero WMI CPU overhead!) so Desktop buttons respond almost instantly
            if (Test-Path "C:\stop-s-rdp.flag") {
              Write-Host "Menerima sinyal stop dari Desktop (Matikan-Server-RDP.bat). Lanjut ke Atomic Auto-Backup & Shutdown..." -ForegroundColor Yellow
              break
            }

            if (Test-Path "C:\save-s-rdp-now.flag") {
              Remove-Item "C:\save-s-rdp-now.flag" -Force -ErrorAction SilentlyContinue
              Write-Host "[LIVE SNAPSHOT] Menyimpan snapshot Vault di tengah sesi tanpa menutup game..." -ForegroundColor Green
              & .\scripts\sync-vault.ps1 `
                -Mode "backup" `
                -VaultPassword $env:VAULT_PASS `
                -RdpUser $env:SETUP_USER `
                -IsLiveSnapshot "true"
            }

            $remTotalMin = ($endTime - (Get-Date)).TotalMinutes

            # Pop-up notification inside RDP 10 minutes & 3 minutes before timer expires so active users aren't surprised!
            if (-not $warned10Min -and $remTotalMin -le 10 -and $remTotalMin -gt 4) {
              $warned10Min = $true
              & msg.exe * /TIME:30 "Info S-RDP: Sesi 6 jam akan berakhir dalam 10 menit. Seluruh data Steam, Discord, & Folder Permanen akan otomatis di-backup!" 2>$null
            }
            if (-not $warned3Min -and $remTotalMin -le 3) {
              $warned3Min = $true
              & msg.exe * /TIME:30 "Peringatan S-RDP: Sesi berakhir dalam 3 menit. Bersiap melakukan Auto-Backup AES-256!" 2>$null
            }

            # Query WMI CPU/RAM telemetry only once every 5 minutes to eliminate WmiPrvSE.exe CPU spikes during AFK gaming!
            if (((Get-Date) - $lastTelemetry).TotalMinutes -ge 5) {
              $lastTelemetry = Get-Date
              $remaining = [math]::Round($remTotalMin, 0)
              $cpuLoad = (Get-CimInstance Win32_Processor | Measure-Object -Property LoadPercentage -Average).Average
              $osInfo = Get-CimInstance Win32_OperatingSystem
              $usedRamGb = [math]::Round(($osInfo.TotalVisibleMemorySize - $osInfo.FreePhysicalMemory) / 1MB, 1)
              $totalRamGb = [math]::Round($osInfo.TotalVisibleMemorySize / 1MB, 1)
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Status AFK Aktif | Sisa Waktu: $remaining mnt | CPU: $cpuLoad% | RAM: $usedRamGb / $totalRamGb GB"
            }

            Start-Sleep -Seconds 5
          }

          Write-Host "Durasi sesi selesai. Memulai penyimpanan Atomic Vault sebelum mesin mati..." -ForegroundColor Green
          $global:LASTEXITCODE = 0
          exit 0

      - name: Atomic Auto-Backup Data Permanen ke Encrypted Vault (AES-256)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VAULT_PASS: ${{ secrets.VAULT_PASSWORD || secrets.RDP_PASSWORD }}
          SETUP_USER: "egandika"
        run: |
          if (-not (Test-Path "C:\ProgramData\S-RDP\vault-root.txt")) {
            Write-Host "Vault belum diinisialisasi pada sesi ini, melewati backup."
            exit 0
          }
          & .\scripts\sync-vault.ps1 `
            -Mode "backup" `
            -VaultPassword $env:VAULT_PASS `
            -RdpUser $env:SETUP_USER `
            -IsLiveSnapshot "false"

      - name: Logout Tailscale Node (Cleanup Akhir Sesi)
        if: always()
        shell: pwsh
        run: |
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) {
            $tsCmd = Get-Command tailscale.exe -ErrorAction SilentlyContinue
            if ($tsCmd) { $tsExe = $tsCmd.Source }
          }
          if (Test-Path $tsExe) {
            Write-Host "Memutuskan node dari Tailscale agar hostname '${{ inputs.hostname }}' tidak bentrok di sesi berikutnya..."
            & $tsExe logout 2>$null
          }
          $global:LASTEXITCODE = 0
          exit 0
